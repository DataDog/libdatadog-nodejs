# Dependabot version updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
      exclude:
        - "@datadog/*"
    groups:
      gh-actions-packages:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    labels:
      - dependabot
      - dependencies
      - javascript
      - semver-patch
    groups:
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@stylistic/*"
          - "globals"
      patch-updates:
        update-types:
          - "patch"
      minor-updates:
        update-types:
          - "minor"

  - package-ecosystem: "npm"
    directory: "/test/crashtracker"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    labels:
      - dependabot
      - dependencies
      - javascript
      - semver-patch
    groups:
      patch-updates:
        update-types:
          - "patch"
      minor-updates:
        update-types:
          - "minor"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - dependabot
      - dependencies
      - rust
      - semver-patch
    ignore:
      # Keep the encoder aligned with libdatadog's pinned version.
      # Explicit update types leave security updates enabled.
      - dependency-name: "zrip"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      napi:
        patterns:
          - "napi"
          - "napi-*"
      libdatadog:
        patterns:
          - "libdd-*"
      wasm-bindgen:
        patterns:
          - "wasm-bindgen"
          - "wasm-bindgen-*"
          - "js-sys"
          - "web-sys"
      patch-updates:
        update-types:
          - "patch"
      minor-updates:
        update-types:
          - "minor"
