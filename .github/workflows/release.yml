name: Release

on:
  push:
    branches:
      - v0.x
  workflow_dispatch:

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      npm-tag: ${{ steps.versions.outputs.npm-tag }}
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        env:
          DEV_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if [ "$DEV_RELEASE" = "true" ]; then
            SUFFIX="dev-$(git rev-parse --short HEAD)+${{ github.run_id }}.${{ github.run_attempt }}"
            VERSION="${VERSION%%-*}-$SUFFIX"
            NPM_TAG=dev
          else
            NPM_TAG=latest
          fi

          {
            echo "npm-tag=$NPM_TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  build-test-wasm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate:
          - library_config
          - pipeline
          - remote_config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Use composite action'
        uses: ./.github/actions/build-test-wasm
        with:
          crate: '${{ matrix.crate }}'

  build-libdatadog-extras:
    uses: Datadog/action-prebuildify/.github/workflows/build.yml@main
    needs: build-test-wasm
    with:
      package-manager: 'yarn'
      cache: true
      min-node-version: 18
      rust: true
      only: darwin-arm64,darwin-x64,linux-arm64,linux-x64
      # libdatadog packages libunwind as a submodule.
      prebuild: >-
        (command -v apk >/dev/null && apk add autoconf automake libtool) ||
        (command -v apt-get >/dev/null && apt-get update &&
        apt-get install -y autoconf automake libtool) || true

  build-libdatadog-wasm:
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-wasm
      - run: npm ci --prefix packages/libdatadog
      - name: Set package version
        run: node packages/libdatadog/scripts/set-version.js '${{ needs.versions.outputs.version }}'
      - run: npm run build:wasm --prefix packages/libdatadog
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libdatadog-wasm
          path: packages/libdatadog/wasm/dist

  build-libdatadog-platform:
    name: Build libdatadog (${{ matrix.package-target }})
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust-target: aarch64-apple-darwin
            package-target: darwin-arm64
            runner: macos-15
          - rust-target: x86_64-apple-darwin
            package-target: darwin-x64
            runner: macos-15-intel
          - rust-target: aarch64-unknown-linux-gnu
            package-target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - rust-target: aarch64-unknown-linux-musl
            package-target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            install-musl: true
          - rust-target: x86_64-unknown-linux-gnu
            package-target: linux-x64-gnu
            runner: ubuntu-latest
          - rust-target: x86_64-unknown-linux-musl
            package-target: linux-x64-musl
            runner: ubuntu-latest
            install-musl: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install musl toolchain
        if: matrix.install-musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Add Rust target
        run: rustup target add '${{ matrix.rust-target }}'
      - run: npm ci --prefix packages/libdatadog
      - name: Set package version
        run: node packages/libdatadog/scripts/set-version.js '${{ needs.versions.outputs.version }}'
      - name: Build native extension
        run: npm run build:native --prefix packages/libdatadog -- --target '${{ matrix.rust-target }}'
      - run: npm run package:native --prefix packages/libdatadog
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libdatadog-binding-${{ matrix.package-target }}
          path: packages/libdatadog/dist/native/*.node
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libdatadog-platform-${{ matrix.package-target }}
          path: packages/libdatadog/dist/packages

  test-libdatadog-wasm:
    needs: build-libdatadog-wasm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix packages/libdatadog
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libdatadog-wasm
          path: packages/libdatadog/wasm/dist
      - run: npm test --prefix packages/libdatadog

  test-libdatadog-platform:
    name: Test libdatadog (${{ matrix.platform.package_target }}, Node ${{ matrix.node }})
    needs:
      - build-libdatadog-platform
      - build-libdatadog-wasm
    strategy:
      fail-fast: false
      matrix:
        platform:
          - package_target: darwin-arm64
            runner: macos-15
          - package_target: darwin-x64
            runner: macos-15-intel
          - package_target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - package_target: linux-x64-gnu
            runner: ubuntu-latest
        node: [18, 24]
    runs-on: ${{ matrix.platform.runner }}
    env:
      DD_LIBDATADOG_EXPECTED_BACKEND: native
      LIBDATADOG_TARGET: ${{ matrix.platform.package_target }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix packages/libdatadog
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libdatadog-binding-${{ matrix.platform.package_target }}
          path: packages/libdatadog/dist/native
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libdatadog-platform-${{ matrix.platform.package_target }}
          path: packages/libdatadog/dist/packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libdatadog-wasm
          path: packages/libdatadog/wasm/dist
      - run: npm test --prefix packages/libdatadog

  test-libdatadog-platform-musl:
    name: Test libdatadog (${{ matrix.platform.package_target }}, Node ${{ matrix.node }})
    needs:
      - build-libdatadog-platform
      - build-libdatadog-wasm
    strategy:
      fail-fast: false
      matrix:
        platform:
          - package_target: linux-arm64-musl
            runner: ubuntu-24.04-arm
          - package_target: linux-x64-musl
            runner: ubuntu-latest
        node: [18, 24]
    runs-on: ${{ matrix.platform.runner }}
    env:
      DD_LIBDATADOG_EXPECTED_BACKEND: native
      LIBDATADOG_TARGET: ${{ matrix.platform.package_target }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libdatadog-binding-${{ matrix.platform.package_target }}
          path: packages/libdatadog/dist/native
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libdatadog-platform-${{ matrix.platform.package_target }}
          path: packages/libdatadog/dist/packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libdatadog-wasm
          path: packages/libdatadog/wasm/dist
      - name: Test in Alpine
        run: |
          docker run --rm \
            --env DD_LIBDATADOG_EXPECTED_BACKEND \
            --env LIBDATADOG_TARGET \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            "node:${{ matrix.node }}-alpine" \
            sh -c '
              apk add --no-cache git
              npm ci --prefix packages/libdatadog
              npm test --prefix packages/libdatadog
            '

  test-libdatadog-windows:
    name: Test libdatadog WASM (Windows, Node ${{ matrix.node }})
    needs: build-libdatadog-wasm
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 24]
    env:
      DD_LIBDATADOG_EXPECTED_BACKEND: wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix packages/libdatadog
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libdatadog-wasm
          path: packages/libdatadog/wasm/dist
      - run: npm test --prefix packages/libdatadog

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-libdatadog-extras
      - build-libdatadog-platform
      - build-libdatadog-wasm
      - test-libdatadog-platform
      - test-libdatadog-platform-musl
      - test-libdatadog-wasm
      - test-libdatadog-windows
      - versions
    environment:
      name: npm
      url: https://npmjs.com/package/@datadog/libdatadog
    permissions:
      id-token: write  # Required for OIDC
      contents: read
    steps:
      - uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        if: github.event_name == 'push'
        id: octo-sts
        with:
          scope: DataDog/libdatadog-nodejs
          policy: self.github.release.push-tags
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # drop GITHUB_TOKEN so the dd-octo-sts token is used for the tag push
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prebuilds
          path: prebuilds
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libdatadog-wasm
          path: packages/libdatadog/wasm/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: libdatadog-platform-*
          path: packages/libdatadog/dist/packages
          merge-multiple: true
      - name: Set package versions
        run: |
          npm pkg set 'version=${{ needs.versions.outputs.version }}'
          node packages/libdatadog/scripts/set-version.js '${{ needs.versions.outputs.version }}'
      - run: chmod -R +x prebuilds
      - run: npm run test:package --prefix packages/libdatadog
      - name: Publish libdatadog WASM
        env:
          NPM_TAG: ${{ needs.versions.outputs.npm-tag }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: bash scripts/npm-publish.sh packages/libdatadog/wasm "$VERSION" "$NPM_TAG"
      - name: Publish libdatadog platform packages
        env:
          NPM_TAG: ${{ needs.versions.outputs.npm-tag }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          for package in packages/libdatadog/dist/packages/*; do
            bash scripts/npm-publish.sh "$package" "$VERSION" "$NPM_TAG"
          done
      - name: Publish libdatadog
        env:
          NPM_TAG: ${{ needs.versions.outputs.npm-tag }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: bash scripts/npm-publish.sh packages/libdatadog "$VERSION" "$NPM_TAG"
      - name: Publish libdatadog extras
        env:
          NPM_TAG: ${{ needs.versions.outputs.npm-tag }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: bash scripts/npm-publish.sh . "$VERSION" "$NPM_TAG"
      - name: Tag release
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ needs.versions.outputs.version }}
          RELEASE_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          git tag "v$RELEASE_VERSION"
          git push "https://x-access-token:$RELEASE_TOKEN@github.com/${{ github.repository }}.git" "v$RELEASE_VERSION"
      - name: Summarize release
        env:
          NPM_TAG: ${{ needs.versions.outputs.npm-tag }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          echo "Published @datadog/libdatadog@$VERSION with the npm $NPM_TAG tag."
          echo "Published @datadog/libdatadog-wasm@$VERSION with the npm $NPM_TAG tag."
          echo "Published @datadog/libdatadog-extras@$VERSION with the npm $NPM_TAG tag."
