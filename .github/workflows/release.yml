name: Release

on:
  push:
    branches:
      - v0.x
  workflow_dispatch:

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      npm-tag: ${{ steps.versions.outputs.npm-tag }}
      tree: ${{ steps.versions.outputs.tree }}
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        env:
          DEV_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if [ "$DEV_RELEASE" = "true" ]; then
            SUFFIX="dev-$(git rev-parse --short HEAD)+${{ github.run_id }}.${{ github.run_attempt }}"
            VERSION="${VERSION%%-*}-$SUFFIX"
            NPM_TAG=dev
          else
            NPM_TAG=latest
          fi

          {
            echo "npm-tag=$NPM_TAG"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  resolve-release-candidate:
    if: github.event_name == 'push'
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run-id: ${{ steps.candidate.outputs.run-id }}
    steps:
      - id: candidate
        env:
          ARTIFACT_NAME: release-candidate-${{ needs.versions.outputs.tree }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PULL=$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '
              [ .[] | select(
                  .state == "closed" and
                  .merged_at != null and
                  .base.ref == "v0.x"
                )
              ]
              | if length == 1 then .[0] else error("expected one merged v0.x pull request") end
              | [.merge_commit_sha, .head.sha, .head.repo.full_name]
              | @tsv
            '
          )
          IFS=$'\t' read -r MERGE_SHA HEAD_SHA HEAD_REPOSITORY <<< "$PULL"

          test "$MERGE_SHA" = "$GITHUB_SHA"
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"

          for attempt in {1..90}; do
            RUN_ID=$(
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME" --jq "
                [
                  .artifacts[]
                  | select(
                      .expired == false and
                      .workflow_run.head_sha == \"$HEAD_SHA\"
                    )
                ]
                | max_by(.created_at).workflow_run.id // empty
              "
            )
            test -z "$RUN_ID" || break
            if test "$attempt" -lt 90; then
              sleep 10
            fi
          done
          test -n "$RUN_ID"

          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

  build-test-wasm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate:
          - library_config
          - pipeline
          - remote_config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Use composite action'
        uses: ./.github/actions/build-test-wasm
        with:
          crate: '${{ matrix.crate }}'

  build-libdatadog-extras:
    if: github.event_name == 'workflow_dispatch'
    uses: Datadog/action-prebuildify/.github/workflows/build.yml@main
    needs: build-test-wasm
    with:
      package-manager: 'yarn'
      cache: true
      min-node-version: 18
      rust: true
      only: darwin-arm64,darwin-x64,linux-arm64,linux-x64
      # libdatadog packages libunwind as a submodule.
      prebuild: >-
        (command -v apk >/dev/null && apk add autoconf automake libtool) ||
        (command -v apt-get >/dev/null && apt-get update &&
        apt-get install -y autoconf automake libtool) || true

  build-libdatadog-wasm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-wasm
      - run: npm ci --prefix packages/libdatadog
      - name: Set package version
        run: node packages/libdatadog/scripts/set-version.js '${{ needs.versions.outputs.version }}'
      - run: npm run build:wasm --prefix packages/libdatadog
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libdatadog-wasm
          path: packages/libdatadog/wasm/dist

  test-libdatadog-wasm:
    if: github.event_name == 'workflow_dispatch'
    needs: build-libdatadog-wasm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix packages/libdatadog
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libdatadog-wasm
          path: packages/libdatadog/wasm/dist
      - run: npm test --prefix packages/libdatadog

  test-libdatadog-windows:
    name: Test libdatadog WASM (Windows, Node ${{ matrix.node }})
    if: github.event_name == 'workflow_dispatch'
    needs: build-libdatadog-wasm
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix packages/libdatadog
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libdatadog-wasm
          path: packages/libdatadog/wasm/dist
      - run: npm test --prefix packages/libdatadog

  publish:
    if: >-
      !cancelled() &&
      needs.versions.result == 'success' &&
      ((github.event_name == 'push' &&
        needs.resolve-release-candidate.result == 'success') ||
       (github.event_name == 'workflow_dispatch' &&
        needs.build-libdatadog-extras.result == 'success' &&
        needs.build-libdatadog-wasm.result == 'success' &&
        needs.test-libdatadog-wasm.result == 'success' &&
        needs.test-libdatadog-windows.result == 'success'))
    runs-on: ubuntu-latest
    needs:
      - build-libdatadog-extras
      - build-libdatadog-wasm
      - resolve-release-candidate
      - test-libdatadog-wasm
      - test-libdatadog-windows
      - versions
    environment:
      name: npm
      url: https://npmjs.com/package/@datadog/libdatadog
    permissions:
      actions: read
      id-token: write  # Required for OIDC
      contents: read
    steps:
      - uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        if: github.event_name == 'push'
        id: octo-sts
        with:
          scope: DataDog/libdatadog-nodejs
          policy: self.github.release.push-tags
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # drop GITHUB_TOKEN so the dd-octo-sts token is used for the tag push
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'push'
        with:
          name: release-candidate-${{ needs.versions.outputs.tree }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-release-candidate.outputs.run-id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          name: prebuilds
          path: prebuilds
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          name: libdatadog-wasm
          path: packages/libdatadog/wasm/dist
      - name: Set package versions
        run: |
          npm pkg set 'version=${{ needs.versions.outputs.version }}'
          node packages/libdatadog/scripts/set-version.js '${{ needs.versions.outputs.version }}'
      - run: chmod -R +x prebuilds
      - run: npm run test:package --prefix packages/libdatadog
      - name: Publish libdatadog WASM
        env:
          NPM_TAG: ${{ needs.versions.outputs.npm-tag }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: bash scripts/npm-publish.sh packages/libdatadog/wasm "$VERSION" "$NPM_TAG"
      - name: Publish libdatadog
        env:
          NPM_TAG: ${{ needs.versions.outputs.npm-tag }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: bash scripts/npm-publish.sh packages/libdatadog "$VERSION" "$NPM_TAG"
      - name: Publish libdatadog extras
        env:
          NPM_TAG: ${{ needs.versions.outputs.npm-tag }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: bash scripts/npm-publish.sh . "$VERSION" "$NPM_TAG"
      - name: Tag release
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ needs.versions.outputs.version }}
          RELEASE_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          git tag "v$RELEASE_VERSION"
          git push "https://x-access-token:$RELEASE_TOKEN@github.com/${{ github.repository }}.git" "v$RELEASE_VERSION"
      - name: Summarize release
        env:
          NPM_TAG: ${{ needs.versions.outputs.npm-tag }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          echo "Published @datadog/libdatadog@$VERSION with the npm $NPM_TAG tag."
          echo "Published @datadog/libdatadog-wasm@$VERSION with the npm $NPM_TAG tag."
          echo "Published @datadog/libdatadog-extras@$VERSION with the npm $NPM_TAG tag."
