name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - run: yarn install
      - run: yarn install
        working-directory: test/crashtracker
      - run: yarn lint

  build-libdatadog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-wasm
      - name: Validate artifact dependencies
        run: npm run check:dependencies
      - run: npm ci --prefix packages/libdatadog
      - run: npm run build --prefix packages/libdatadog
      - name: Build symbolized WASM for size attribution
        run: npm run size:profile --prefix packages/libdatadog
      - name: Report and validate WASM binary size
        env:
          WASM_SIZE_REPORT: ${{ runner.temp }}/wasm-size-report.md
        run: >-
          npm run report:wasm-size --prefix packages/libdatadog --
          ../../target/size/libdatadog_wasm_bg.wasm
      - name: Post WASM size report
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          WASM_SIZE_REPORT: ${{ runner.temp }}/wasm-size-report.md
        with:
          script: |
            const fs = require('node:fs')
            if (!fs.existsSync(process.env.WASM_SIZE_REPORT)) {
              core.warning('The WASM size report was not generated')
              return
            }

            const marker = '<!-- libdatadog-wasm-size-report -->'
            const body = `${marker}\n${fs.readFileSync(process.env.WASM_SIZE_REPORT, 'utf8')}`
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            })
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )

            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libdatadog-wasm
          path: packages/libdatadog/wasm/dist

  test-libdatadog:
    needs: build-libdatadog
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix packages/libdatadog
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libdatadog-wasm
          path: packages/libdatadog/wasm/dist
      - run: npm test --prefix packages/libdatadog

  test-libdatadog-windows:
    name: Test libdatadog WASM (Windows, Node ${{ matrix.node }})
    needs: build-libdatadog
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix packages/libdatadog
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libdatadog-wasm
          path: packages/libdatadog/wasm/dist
      - run: npm test --prefix packages/libdatadog

  build-test-wasm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate:
          - library_config
          - pipeline
          - remote_config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Use composite action'
        uses: ./.github/actions/build-test-wasm
        with:
          crate: '${{ matrix.crate }}'

  build-libdatadog-extras:
    uses: Datadog/action-prebuildify/.github/workflows/build.yml@main
    needs: build-test-wasm
    with:
      package-manager: 'yarn'
      cache: true
      min-node-version: 18
      rust: true
      only: darwin-arm64,darwin-x64,linux-arm64,linux-x64
      prebuild: >-
        (command -v apk >/dev/null && apk add autoconf automake libtool) ||
        (command -v apt-get >/dev/null && apt-get update &&
        apt-get install -y autoconf automake libtool) || true

  package-size:
    runs-on: ubuntu-latest
    needs: build-libdatadog-extras
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - run: yarn install
      - name: Compute module size tree and report
        uses: qard/heaviest-objects-in-the-universe@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  release-candidate:
    if: github.event_name == 'pull_request' && github.base_ref == 'v0.x'
    needs:
      - lint
      - package-size
      - test-libdatadog
      - test-libdatadog-windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prebuilds
          path: prebuilds
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libdatadog-wasm
          path: packages/libdatadog/wasm/dist
      - id: candidate
        run: |
          TREE=$(git rev-parse 'HEAD^{tree}')
          echo "$TREE" > release-candidate
          echo "artifact-name=release-candidate-$TREE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.candidate.outputs.artifact-name }}
          path: |
            prebuilds
            packages/libdatadog/wasm/dist
            release-candidate
          if-no-files-found: error
