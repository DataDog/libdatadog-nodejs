[package]
name = "libdatadog-data-pipeline"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies.libdd-data-pipeline-core]
git = "https://github.com/DataDog/libdatadog.git"
rev = "63e7f235b372b395e9a2ecae874e7aae3e3a4e5c"
default-features = false

[dependencies.libdd-trace-obfuscation]
git = "https://github.com/DataDog/libdatadog.git"
rev = "63e7f235b372b395e9a2ecae874e7aae3e3a4e5c"
default-features = false

[features]
default = []
compression = ["libdd-data-pipeline-core/compression"]
regex-lite = ["libdd-data-pipeline-core/regex-lite", "libdd-trace-obfuscation/regex-lite"]
stats = ["libdd-data-pipeline-core/stats-obfuscation"]
