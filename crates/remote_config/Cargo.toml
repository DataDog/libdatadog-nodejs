[package]
name = "remote-config"
version = "0.1.0"
edition = "2021"
description = "Wasm binding for libdatadog's remote config client"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libdd-remote-config = { git = "https://github.com/DataDog/libdatadog.git", tag = "v44.0.0", default-features = false, features = ["client", "agentless"] }
libdd-common = { git = "https://github.com/DataDog/libdatadog.git", tag = "v44.0.0", default-features = false }
libdatadog-nodejs-capabilities = { path = "../capabilities" }

wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
# Do not use --all-features: Binaryen may then emit WebAssembly GC instructions,
# which are not supported by Node.js 18. Keep this list to features used by the
# Rust output and supported by every Node.js version that we test.
wasm-opt = [
  "-O",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-reference-types",
  "--enable-multivalue",
]

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = [
  "-O",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-reference-types",
  "--enable-multivalue",
  "-g",
]
