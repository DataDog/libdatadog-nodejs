[package]
name = "libdatadog"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "libdatadog"

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
anyhow = "1"
bytes = "1"
futures = "0.3"
http = "1"
libdd-ddsketch = "1.1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
napi = { version = "3", default-features = false, features = ["async"] }
zstd = { version = "0.13.3", default-features = false, features = ["thin"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
napi = { version = "3", default-features = false, features = ["async-runtime"] }
napi-async-runtime = "0.2"
zrip = { version = "=0.6.0", default-features = false, features = ["alloc"] }

[dependencies.libdd-capabilities]
git = "https://github.com/DataDog/libdatadog.git"
rev = "3fa1d1395022d3f3fcff6215cc8aa22d5df616df"
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.libdatadog-data-pipeline]
path = "../libdatadog-data-pipeline"
features = ["compression"]

[target.'cfg(target_arch = "wasm32")'.dependencies.libdatadog-data-pipeline]
path = "../libdatadog-data-pipeline"
features = ["compression", "regex-lite"]

[dependencies.libdatadog-remote-config]
path = "../libdatadog-remote-config"
features = ["agentless", "regex-lite"]

[build-dependencies]
napi-build = "2"
