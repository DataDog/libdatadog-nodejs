[package]
name = "libdatadog"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "libdatadog"

[dependencies]
napi = { version = "3", default-features = false, features = ["async", "napi8"] }
napi-derive = "3"
anyhow = "1"
bytes = "1"
futures = "0.3"
http = "1"
libdd-ddsketch = "1.1.1"
zstd = { version = "0.13.3", default-features = false, features = ["thin"] }

[dependencies.libdd-capabilities]
git = "https://github.com/DataDog/libdatadog.git"
rev = "9fb27ea309363bb4852d093a8e5c85b1c0b9a7d0"
default-features = false

[dependencies.libdatadog-data-pipeline]
path = "../libdatadog-data-pipeline"
features = ["compression"]

[build-dependencies]
napi-build = "2"
