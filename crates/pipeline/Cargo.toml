[package]
name = "pipeline"
version = "0.1.0"
edition = "2021"
description = "Wasm binding for pipeline span management and trace export"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
libdatadog-nodejs-capabilities = { path = "../capabilities" }
libdd-capabilities = { git = "https://github.com/DataDog/libdatadog.git", tag = "v44.0.0" }
libdd-common = { git = "https://github.com/DataDog/libdatadog.git", tag = "v44.0.0", default-features = false }
libdd-data-pipeline = { git = "https://github.com/DataDog/libdatadog.git", tag = "v44.0.0", default-features = false, features = ["telemetry"] }
libdd-trace-utils = { git = "https://github.com/DataDog/libdatadog.git", tag = "v44.0.0", default-features = false, features = ["change-buffer"] }
libdd-shared-runtime = { git = "https://github.com/DataDog/libdatadog.git", tag = "v44.0.0", default-features = false }
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["js"] }

# Do not use --all-features: Binaryen may then emit WebAssembly GC instructions,
# which are not supported by Node.js 18. Keep this list to features used by the
# Rust output and supported by every Node.js version that we test.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-reference-types",
  "--enable-multivalue",
]
