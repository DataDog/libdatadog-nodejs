[package]
name = "libdatadog-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "libdatadog_wasm"

[dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
libdd-ddsketch = "1.1.1"
# Keep this aligned with the pure-Rust WASM encoder used by libdatadog.
zrip = { version = "=0.6.0", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[package.metadata.wasm-pack.profile.release]
# Do not use --all-features: Binaryen may then emit WebAssembly GC instructions,
# which are not supported by Node.js 18. Keep this list to features used by the
# Rust output and supported by every Node.js version that we test.
wasm-opt = [
  "-Oz",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-reference-types",
  "--enable-multivalue",
  "--converge",
]
