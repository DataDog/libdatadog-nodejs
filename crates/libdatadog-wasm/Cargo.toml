[package]
name = "libdatadog-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "libdatadog_wasm"

[dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
anyhow = "1"
bytes = "1"
futures = "0.3"
http = "1"
# The agentless v0.4 path does not compile or evaluate user-provided patterns.
# Use the smaller regex engine so the full engine and its Unicode tables are
# removed by the WASM linker.

[dependencies.libdd-ddsketch]
git = "https://github.com/DataDog/libdatadog.git"
rev = "7d014fe1695bc122925d6403e758c558059bb8c7"

[dependencies.libdd-capabilities]
git = "https://github.com/DataDog/libdatadog.git"
rev = "7d014fe1695bc122925d6403e758c558059bb8c7"
default-features = false

[dependencies.libdd-trace-obfuscation]
git = "https://github.com/DataDog/libdatadog.git"
rev = "7d014fe1695bc122925d6403e758c558059bb8c7"
default-features = false

[dependencies.libdd-common]
git = "https://github.com/DataDog/libdatadog.git"
rev = "7d014fe1695bc122925d6403e758c558059bb8c7"
default-features = false
features = ["regex-lite"]

[dependencies.libdatadog-data-pipeline]
path = "../libdatadog-data-pipeline"
features = ["compression", "regex-lite", "stats"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[package.metadata.wasm-pack.profile.release]
# Shared release and profiling Cargo artifacts retain target feature metadata.
# Disable GC because Binaryen can otherwise emit instructions that Node.js 18 does not support.
wasm-opt = [
  "-O3",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-reference-types",
  "--enable-multivalue",
  "--disable-gc",
  "--enable-simd",
  "--converge",
]

[package.metadata.wasm-pack.profile.profiling]
# Keep function names for crate attribution after wasm-opt runs in Linux CI.
wasm-opt = [
  "-O3",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-reference-types",
  "--enable-multivalue",
  "--disable-gc",
  "--enable-simd",
  "--converge",
  "--strip-dwarf",
  "-g",
]

[package.metadata.wasm-pack.profile.profiling.wasm-bindgen]
dwarf-debug-info = true
